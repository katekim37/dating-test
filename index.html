<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 기반 현실 연애 심리 테스트 | VibeNight</title>
    <meta name="description" content="나의 진짜 연애 성향은? 데이터로 분석하는 팩트폭행 현실 연애 심리 테스트!">
    <link rel="canonical" href="https://loveaffair.cloud/">
    <meta name="google-site-verification" content="uwae2rQ18lTmAB_f4M8Y6q6CyDZ1ZHinI1dot0nllAw">
    <meta name="naver-site-verification" content="f335debae560c82a0e9ee263e97684a751b8a099" />
    <meta property="og:title" content="현실 연애 심리 테스트">
    <meta property="og:description" content="나의 진짜 연애 성향은? 데이터로 분석하는 팩트폭행 현실 연애 심리 테스트!">
    <meta property="og:image" content="https://loveaffair.cloud/og_image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://loveaffair.cloud/">
    
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Start Screen -->
        <section id="start-screen" class="screen active">
            <div class="glass-card">
                <span class="badge">VibeNight Original</span>
                <h1 class="main-title">데이터 기반<br><span class="neon-text">현실 연애</span><br>심리 테스트</h1>
                <p class="subtitle">나의 진짜 연애 성향을 확인해 보세요.<br>(※ 뼈 맞음 주의)</p>
                <button id="start-btn" class="glow-btn">테스트 시작하기</button>
            </div>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen">
            <div class="glass-card">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div class="question-container">
                    <span id="question-number" class="q-num">Q.1</span>
                    <h2 id="question-text" class="q-text">질문 텍스트가 들어갑니다.</h2>
                </div>
                <div id="options-container" class="options-container">
                    <!-- Options will be dynamically injected here -->
                </div>
            </div>
        </section>

        <!-- Loading Screen -->
        <section id="loading-screen" class="screen">
            <div class="glass-card loading-card">
                <div class="spinner"></div>
                <h2>데이터 분석 중...</h2>
                <p>당신의 연애 성향을 도출하고 있습니다.</p>
            </div>
        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="screen">
            <div class="glass-card result-card">
                <h2 class="result-subtitle">당신의 연애 성향은...</h2>
                <h1 id="result-title" class="result-title neon-text">결과 타이틀</h1>
                <div class="result-desc-box">
                    <p id="result-desc" class="result-desc">결과 상세 설명</p>
                </div>
                <div class="action-buttons">
                    <button id="share-btn" class="outline-btn">결과 공유하기</button>
                    <button id="retry-btn" class="glow-btn">다시하기</button>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
